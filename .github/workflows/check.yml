name: Checks and native desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux tests and extension build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libglib2.0-bin gjs
          xvfb-run -a python -B -m unittest discover -s tests -v
          node tests/test_ui.mjs
          gjs -m tests/test_proxy_gjs.mjs
          node --input-type=module --check < gnome-extension/gpt-usage@local/extension.js
          node --input-type=module --check < gnome-extension/gpt-usage@local/prefs.js
          python -B scripts/package_ego.py
      - name: Native desktop tests
        if: runner.os != 'Linux'
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Standalone desktop build
        run: |
          python -m pip install --no-cache-dir 'pyinstaller>=6.11,<7'
          python -B scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/desktop/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ego-submission-candidate
          path: dist/ego/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: gnome-extension
          path: dist/*.shell-extension.zip
