name: Build downloadable applications
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gnome:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle verified Codex runtime
        run: python -B scripts/fetch_codex.py --target '${{ matrix.target }}'
      - name: Build installable extension
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin
          python -B scripts/package_extension.py --target '${{ matrix.target }}'
          python -B scripts/package_release.py --target '${{ matrix.target }}'
          python -B scripts/package_companion.py --target '${{ matrix.target }}'
      - name: Build source-only EGO submission candidate
        if: matrix.target == 'linux-x64'
        run: |
          python -B scripts/package_ego.py
          cp dist/ego/* dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm native build architecture
        run: python -B -c "from scripts.build_desktop import target; assert target() == '${{ matrix.target }}', target()"
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Fetch verified bundled runtime
        run: python -B scripts/fetch_codex.py --target '${{ matrix.target }}'
      - name: Build standalone GUI
        run: |
          python -m pip install --no-cache-dir 'pyinstaller>=6.11,<7'
          python -B scripts/build_desktop.py --bundle-codex
          python -B scripts/package_release.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gnome, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create reviewable draft with direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes 'Download the GNOME ZIP, Windows EXE, or macOS application for your platform. Sign in from Settings; no source checkout, Python, or Codex installation is needed for the Windows/macOS builds. The full GNOME package requires system Python 3.10+. The EGO submission candidate is a separate source-only ZIP and requires the Linux companion archive (system GJS and Python 3.10+). It has not been approved by extensions.gnome.org; see docs/EGO-PUBLISHING.md before submitting.' release/*
