[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-usage-indicator"
version = "0.2.0"
description = "Codex subscription quota for GNOME, Windows and macOS"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
gpt-usage = "gpt_usage.cli:main"
gpt-usage-desktop = "gpt_usage.desktop:main"

[tool.setuptools]
packages = ["gpt_usage"]
